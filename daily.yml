name: Daily Briefing

on:
  schedule:
    - cron: '0 19 * * *'   # 14:00 CEST (UTC+2 verano) / 13:00 CET (UTC+1 invierno)
  workflow_dispatch:         # permite ejecutar manualmente desde la web de GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # necesario para hacer git push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance requests

      - name: Generar briefing
        run: python generar_briefing.py

      - name: Commit y push index.html
        run: |
          git config user.email "briefing-bot@github.com"
          git config user.name "Briefing Bot"
          git add index.html
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "📊 Briefing $(date +'%d/%m/%Y %H:%M UTC')"
          git push
